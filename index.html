<html lang="en">
<head>

<meta name="theme-color" content="#173b63">
<title>Work Rota V22</title>
<style>
:root{--navy:#173b63;--bg:#f4f7fb;--card:#fff;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#142033}
header{background:var(--navy);color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:4;box-shadow:0 2px 12px #0002}
.head{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:24px;margin:0}.sub{opacity:.8;font-size:13px;margin-top:3px}
button,select,input{font:inherit}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}
.adminBtn{background:white;color:var(--navy)}
main{max-width:900px;margin:auto;padding:18px}
.monthbar{display:flex;justify-content:space-between;align-items:center;background:white;border-radius:16px;padding:12px;margin-bottom:14px;box-shadow:0 2px 10px #102a4310}
.monthbar h2{margin:0;font-size:20px}.arrow{background:#eef3f8;color:#173b63;font-size:20px;min-width:44px}
.filterbar{background:white;border-radius:14px;padding:12px;margin-bottom:14px;box-shadow:0 2px 10px #102a4310}.filterbar label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.filterbar select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:white}.notice{background:#fff7d6;border:1px solid #f1d46b;border-radius:12px;padding:11px 13px;margin-bottom:14px;font-size:14px}
.status{font-size:12px;color:var(--muted);margin:0 0 10px 2px}.status.bad{color:#b91c1c}
.day{background:white;border-radius:15px;margin:10px 0;overflow:hidden;box-shadow:0 2px 10px #102a4310}
.dayhead{padding:11px 13px;background:#edf2f7;display:flex;justify-content:space-between;font-weight:800}
.today .dayhead{background:#dbeafe;color:#173b63}.closed .dayhead{background:#fee2e2;color:#991b1b}
.shift{display:grid;grid-template-columns:12px 1fr auto;gap:11px;align-items:center;padding:12px 13px;border-top:1px solid var(--line)}
.dot{width:12px;height:36px;border-radius:7px}.name{font-weight:800}.time{font-weight:700;color:#334155}
.empty{padding:18px;color:var(--muted);text-align:center}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tag{background:white;border-radius:20px;padding:7px 10px;font-size:12px;box-shadow:0 1px 5px #0001}.tag i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
footer{text-align:center;color:#94a3b8;font-size:12px;padding:18px}
.modal{display:none;position:fixed;inset:0;background:#071525aa;z-index:20;padding:18px;overflow:auto}
.panel{max-width:650px;margin:30px auto;background:white;border-radius:18px;padding:18px}.panel h2{margin-top:0}
.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary{background:var(--navy);color:white}.secondary{background:#e8eef5;color:#173b63}.danger{background:#fee2e2;color:#991b1b}
.editshift{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:7px}.holidayLine{grid-column:1/3;display:flex;align-items:center;gap:8px;font-weight:800;padding:3px 2px}.holidayLine input{width:22px;height:22px}.small{font-size:12px;color:var(--muted)}#loginError{color:#b91c1c;font-size:13px}
@media(max-width:520px){main{padding:12px}.editshift{grid-template-columns:1fr 1fr}.editshift button{grid-column:1/3}}

.printBtn{width:100%;margin-top:10px;background:var(--navy);color:white}
@media print{
 @page{size:auto;margin:8mm}
 header,.filterbar,.notice,.status,.legend,footer,.arrow{display:none!important}
 body{background:#fff}
 main{max-width:none;padding:0}
 .monthbar{box-shadow:none;margin:0 0 8px;padding:0;background:#fff}
 .monthbar h2{font-size:20px}
 .day{box-shadow:none;border:1px solid #cbd5e1;border-radius:5px;margin:4px 0;break-inside:avoid}
 .dayhead{padding:5px 8px}
 .shift{padding:5px 8px}
 .dot{height:20px}
 .empty{padding:6px}
}

</style>
</head>
<body>
<header><div class="head"><div><h1>Work Rota <span style="font-size:14px;opacity:.85">V22</span></h1><div class="sub">Staff rota</div></div><button class="btn adminBtn" onclick="openAdmin()">Admin</button></div></header>
<main>
<div class="monthbar"><button class="btn arrow" onclick="changeMonth(-1)">‹</button><h2 id="monthTitle"></h2><button class="btn arrow" onclick="changeMonth(1)">›</button></div>
<div class="filterbar"><label for="nameFilter">Filter by name</label><select id="nameFilter" onchange="render()"><option value="">Everyone</option><option>ANDY</option><option>LYNN</option><option>BEV</option><option>BEVERLY</option><option>CODY</option><option>EMILY</option><option>NOT ASSIGNED</option></select><button type="button" class="btn primary printBtn" onclick="printMonth()">Print month</button></div>

<div id="status" class="status">Loading shared rota…</div>
<div id="rota"></div><div class="legend" id="legend"></div>
</main>

<div class="modal" id="loginModal"><div class="panel">

<div id="loginError"></div>
<div class="actions"><button class="btn primary" onclick="login()">Login</button><button class="btn secondary" onclick="closeModal('loginModal')">Cancel</button></div>
</div></div>

<div class="modal" id="adminModal"><div class="panel">
<h2>Edit rota</h2>
<div class="field"><label>Date</label><input type="date" id="editDate" onchange="loadEditor()"></div>
<div class="field"><label><input type="checkbox" id="closedCheck" style="width:auto" onchange="toggleClosed()"> Closed</label></div>

<div class="actions"><button class="btn secondary" onclick="addShiftRow()">+ Add staff</button><button class="btn primary" onclick="saveDay()">Save day</button><button class="btn secondary" onclick="closeModal('adminModal')">Done</button></div>
<div id="adminStatus" class="small" style="margin-top:10px"></div>
</div></div>

let data={}, view=new Date(2026,9,1), adminPin="";
const fmtDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

function status(msg,bad=false){
 const e=document.getElementById("status");
 e.textContent=msg;
 e.className="status"+(bad?" bad":"");
}
function buildSeedRota(){
 data={};
 for(const r of seedRows){
  const key=r[0];
  const entry=data[key]||(data[key]={shifts:[],closed:false});
  if(r[1]==="CLOSED") entry.closed=true;
  else entry.shifts.push([r[1],r[2]+"–"+r[3]]);
 }
}
async function loadRota(){
 status("Loading shared rota…");
 try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/rota?select=id,shift_date,staff_name,start_time,end_time,is_closed&order=shift_date.asc,id.asc",{
   headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY},
   cache:"no-store"
  });
  if(!r.ok)throw new Error("Could not load shared rota.");
  const rows=await r.json();
  if(!Array.isArray(rows)||!rows.length)throw new Error("No shared rota rows found.");
  data={};
  for(const row of rows){
   const key=row.shift_date;
   const entry=data[key]||(data[key]={shifts:[],closed:false});
   if(row.is_closed||row.staff_name==="CLOSED") entry.closed=true;
   else{
    const st=(row.start_time||"").slice(0,5), en=(row.end_time||"").slice(0,5);
    entry.shifts.push([row.staff_name,(st||en)?st+"–"+en:"–"]);
   }
  }
  status("Rota is up to date.");
  render();
 }catch(e){
  buildSeedRota();
  status("Showing backup rota — shared rota could not be loaded.",true);
  render();
 }
}
function render(){
 document.getElementById("monthTitle").textContent=view.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
 const y=view.getFullYear(),m=view.getMonth(),days=new Date(y,m+1,0).getDate(),today=fmtDate(new Date());
 const filter=document.getElementById("nameFilter")?.value||"";
 let html="";
 for(let n=1;n<=days;n++){
  const dt=new Date(y,m,n),key=fmtDate(dt),entry=data[key]||{shifts:[],closed:false};
  const cls="day"+(key===today?" today":"")+(entry.closed?" closed":"");
  const visibleShifts=filter?entry.shifts.filter(x=>x[0]===filter):entry.shifts;
  if(filter&&!visibleShifts.length)continue;
  html+=`<section class="${cls}"><div class="dayhead"><span>${dt.toLocaleDateString("en-GB",{weekday:"short"})} ${n}${suffix(n)}</span><span>${entry.closed?"CLOSED":""}</span></div>`;
  if(entry.closed) html+=`<div class="empty">Closed</div>`;
  else if(!visibleShifts.length) html+=`<div class="empty">No shifts entered</div>`;
  else visibleShifts.forEach(x=>html+=`<div class="shift"><span class="dot" style="background:${staff[x[0]]||"#94a3b8"}"></span><span class="name">${x[0]}</span><span class="time">${x[1]==="00:00–00:00"?"HOLIDAY":x[1]}</span></div>`);
  html+="</section>";
 }
 document.getElementById("rota").innerHTML=html;
 document.getElementById("legend").innerHTML=Object.entries(staff).map(([n,c])=>`<span class="tag"><i style="background:${c}"></i>${n}</span>`).join("");
}
function suffix(n){
 if(n%100>=11&&n%100<=13)return"th";
 return({1:"st",2:"nd",3:"rd"}[n%10]||"th");
}
function changeMonth(x){
 view=new Date(view.getFullYear(),view.getMonth()+x,1);
 render();
}
function printMonth(){
 const y=view.getFullYear(), m=view.getMonth();
 const monthName=view.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
 const days=new Date(y,m+1,0).getDate();
 const first=new Date(y,m,1);
 const mondayIndex=(first.getDay()+6)%7;
 const filter=document.getElementById("nameFilter")?.value||"";
 let cells=[];
 for(let i=0;i<mondayIndex;i++) cells.push('<div class="pcell blank"></div>');
 for(let n=1;n<=days;n++){
   const key=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`;
   const e=data[key]||{shifts:[],closed:false};
   let body="";
   if(e.closed){
     body='<div class="pclosed">CLOSED</div>';
   }else{
     let shifts=e.shifts;
     if(filter) shifts=shifts.filter(x=>x[0]===filter);
     body=shifts.map(x=>`<div class="pshift"><b class="pname" style="background:${staff[x[0]]||"#cbd5e1"}">${x[0]==="NOT ASSIGNED"?"REQUIRED":x[0]}</b><span>${x[1]==="00:00–00:00"?"HOLIDAY":x[1]}</span></div>`).join("");
   }
   cells.push(`<div class="pcell"><div class="pdate">${n}</div>${body}</div>`);
 }
 while(cells.length%7) cells.push('<div class="pcell blank"></div>');
 const html=`<!doctype html><html><head><meta charset="utf-8"><title>${monthName} Work Rota</title>
 <style>
 @page{size:A4 portrait;margin:7mm}
 *{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;color:#142033}
 h1{text-align:center;margin:0 0 3mm;font-size:20px}
 .week{display:grid;grid-template-columns:repeat(7,1fr);font-weight:800;text-align:center;font-size:8px;margin-bottom:1mm}
 .grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:35mm;border-left:1px solid #aab4c0;border-top:1px solid #aab4c0}
 .pcell{border-right:1px solid #aab4c0;border-bottom:1px solid #aab4c0;padding:1.2mm;overflow:hidden}
 .blank{background:#f7f8fa}.pdate{font-weight:900;font-size:9px;margin-bottom:1mm}
 .pshift{display:flex;flex-direction:column;align-items:stretch;gap:.5mm;font-size:8px;line-height:1.2;margin:1mm 0;font-weight:800}
 .pshift .pname{display:block;width:100%;padding:1mm 1.2mm;color:#000!important;font-size:9px;font-weight:900;white-space:nowrap;border:1px solid rgba(0,0,0,.18)} .pshift span{white-space:nowrap;font-size:8px;color:#142033;font-weight:800;padding-left:1mm}
 .pclosed{font-weight:900;color:#b91c1c;background:#fee2e2;border-radius:3px;padding:2mm;text-align:center;font-size:9px;margin-top:3mm}
 .foot{text-align:right;font-size:7px;color:#64748b;margin-top:2mm}
 </style></head><body><h1>${monthName}</h1>
 <div class="week"><div>Monday</div><div>Tuesday</div><div>Wednesday</div><div>Thursday</div><div>Friday</div><div>Saturday</div><div>Sunday</div></div>
 <div class="grid">${cells.join("")}</div><div class="foot">Work Rota • V22</div>
 <script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`;
 const w=window.open("","_blank");
 if(!w){alert("Please allow pop-ups to print the rota.");return}
 w.document.open();w.document.write(html);w.document.close();
}

function closeModal(id){document.getElementById(id).style.display="none"}
function openAdmin(){
 document.getElementById("loginError").textContent="";
 document.getElementById("adminPin").value="";
 document.getElementById("loginModal").style.display="block";
 setTimeout(()=>document.getElementById("adminPin").focus(),50);
}
function openEditor(){
 closeModal("loginModal");
 document.getElementById("adminModal").style.display="block";
 document.getElementById("editDate").value=fmtDate(new Date(view.getFullYear(),view.getMonth(),1));
 loadEditor();
}
async function login(){
 const pin=document.getElementById("adminPin").value.trim();
 const err=document.getElementById("loginError");
 if(!/^\d{6}$/.test(pin)){err.textContent="Enter your 6-digit PIN.";return}
 err.textContent="Checking…";
 try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/check_admin_pin",{
   method:"POST",
   headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},
   body:JSON.stringify({p_pin:pin})
  });
  const ok=await r.json();
  if(!r.ok||ok!==true)throw new Error("Incorrect PIN.");
  adminPin=pin;
  err.textContent="";
  openEditor();
 }catch(e){adminPin="";err.textContent=e.message}
}
function loadEditor(){
 const k=document.getElementById("editDate").value;
 const e=data[k]||{shifts:[],closed:false};
 document.getElementById("closedCheck").checked=e.closed;
 document.getElementById("shiftEditor").innerHTML="";
 e.shifts.forEach(x=>{
  const p=x[1].split("–");
  addShiftRow(x[0],p[0]||"09:00",p[1]||"15:00",x[1]==="00:00–00:00");
 });
 if(!e.closed&&!e.shifts.length)addShiftRow();
 toggleClosed();
}
function toggleClosed(){
 document.getElementById("shiftEditor").style.display=document.getElementById("closedCheck").checked?"none":"block";
}
function addShiftRow(name="ANDY",start="09:00",end="15:00",holiday=false){
 const div=document.createElement("div");
 div.className="editshift";
 div.innerHTML=`<select class="staffName">${Object.keys(staff).map(n=>`<option ${n===name?"selected":""}>${n}</option>`).join("")}</select>
 <div class="timeFields" style="display:flex;gap:6px"><input class="startTime" type="time" value="${holiday?"00:00":start}"><input class="endTime" type="time" value="${holiday?"00:00":end}"></div>

 <button class="btn danger" onclick="this.parentElement.remove()">Remove</button>`;

function toggleHoliday(box){
 const row=box.closest(".editshift");
 const times=row.querySelector(".timeFields");
 const inputs=times.querySelectorAll("input");
 if(box.checked){
  inputs.forEach(i=>{i.value="00:00";i.disabled=true});
  times.style.opacity=".35";
 }else{
  inputs.forEach((i,n)=>{i.disabled=false;if(i.value==="00:00")i.value=n===0?"09:00":"15:00"});
  times.style.opacity="1";
 }
}
async function saveDay(){
 const k=document.getElementById("editDate").value;
 const closed=document.getElementById("closedCheck").checked;
 const msg=document.getElementById("adminStatus");
 if(!adminPin){msg.textContent="Please enter your Admin PIN again.";return}
 let rows=[];
 if(!closed){
  document.querySelectorAll(".editshift").forEach(r=>{
   const holiday=r.querySelector(".holidayCheck")?.checked;
   rows.push({
    staff_name:r.querySelector(".staffName").value,
    start_time:holiday?"00:00":(r.querySelector(".startTime").value||""),
    end_time:holiday?"00:00":(r.querySelector(".endTime").value||"")
   });
  });
 }
 try{
  msg.textContent="Saving…";
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/save_rota_day",{
   method:"POST",
   headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},
   body:JSON.stringify({p_pin:adminPin,p_date:k,p_rows:rows,p_closed:closed})
  });
  const ok=await r.json();
  if(!r.ok)throw new Error("Could not save rota.");
  if(ok!==true)throw new Error("Incorrect PIN.");
  data[k]={closed:closed,shifts:closed?[]:rows.map(x=>[x.staff_name,(x.start_time||"")+"–"+(x.end_time||"")])};
  render();
  await loadRota();
  msg.textContent="Saved successfully.";
 }catch(e){msg.textContent=e.message}
}

loadRota();

</script>
