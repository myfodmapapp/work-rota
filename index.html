<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b63">
<title>Work Rota</title>
<style>
:root{--navy:#173b63;--bg:#f4f7fb;--card:#fff;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#142033}
header{background:var(--navy);color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:4;box-shadow:0 2px 12px #0002}
.head{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:24px;margin:0}.sub{opacity:.8;font-size:13px;margin-top:3px}
button,select,input{font:inherit}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}
.adminBtn{background:white;color:var(--navy)}
main{max-width:900px;margin:auto;padding:18px}
.monthbar{display:flex;justify-content:space-between;align-items:center;background:white;border-radius:16px;padding:12px;margin-bottom:14px;box-shadow:0 2px 10px #102a4310}
.monthbar h2{margin:0;font-size:20px}.arrow{background:#eef3f8;color:#173b63;font-size:20px;min-width:44px}
.notice{background:#fff7d6;border:1px solid #f1d46b;border-radius:12px;padding:11px 13px;margin-bottom:14px;font-size:14px}
.day{background:white;border-radius:15px;margin:10px 0;overflow:hidden;box-shadow:0 2px 10px #102a4310}
.dayhead{padding:11px 13px;background:#edf2f7;display:flex;justify-content:space-between;font-weight:800}
.today .dayhead{background:#dbeafe;color:#173b63}.closed .dayhead{background:#fee2e2;color:#991b1b}
.shift{display:grid;grid-template-columns:12px 1fr auto;gap:11px;align-items:center;padding:12px 13px;border-top:1px solid var(--line)}
.dot{width:12px;height:36px;border-radius:7px}.name{font-weight:800}.time{font-weight:700;color:#334155}
.empty{padding:18px;color:var(--muted);text-align:center}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tag{background:white;border-radius:20px;padding:7px 10px;font-size:12px;box-shadow:0 1px 5px #0001}.tag i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
footer{text-align:center;color:#94a3b8;font-size:12px;padding:18px}
.modal{display:none;position:fixed;inset:0;background:#071525aa;z-index:20;padding:18px;overflow:auto}
.panel{max-width:650px;margin:30px auto;background:white;border-radius:18px;padding:18px}.panel h2{margin-top:0}
.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.primary{background:var(--navy);color:white}.secondary{background:#e8eef5;color:#173b63}.danger{background:#fee2e2;color:#991b1b}
.editday{border:1px solid var(--line);border-radius:12px;padding:11px;margin:10px 0}.editshift{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:7px}
.small{font-size:12px;color:var(--muted)}#loginError{color:#b91c1c;font-size:13px}
@media(max-width:520px){main{padding:12px}.row{grid-template-columns:1fr}.editshift{grid-template-columns:1fr 1fr}.editshift button{grid-column:1/3}}
</style>
</head>
<body>
<header><div class="head"><div><h1>Work Rota</h1><div class="sub">Staff rota</div></div><button class="btn adminBtn" onclick="openAdmin()">Admin</button></div></header>
<main>
<div class="monthbar"><button class="btn arrow" onclick="changeMonth(-1)">‹</button><h2 id="monthTitle"></h2><button class="btn arrow" onclick="changeMonth(1)">›</button></div>
<div class="notice">Tap through the month to check your shifts. Changes made on this device are saved automatically.</div>
<div id="rota"></div><div class="legend" id="legend"></div>
</main>
<footer>Work Rota • Temporary staff rota app</footer>

<div class="modal" id="loginModal"><div class="panel">
<h2>Admin login</h2><p class="small">Enter the admin PIN to edit the rota.</p>
<div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="Enter PIN"></div>
<div id="loginError"></div>
<div class="actions"><button class="btn primary" onclick="login()">Login</button><button class="btn secondary" onclick="closeModal('loginModal')">Cancel</button></div>
</div></div>

<div class="modal" id="adminModal"><div class="panel">
<h2>Edit rota</h2>
<p class="small">Choose a date, then add or remove staff. Press Save when finished.</p>
<div class="field"><label>Date</label><input type="date" id="editDate" onchange="loadEditor()"></div>
<div class="field"><label><input type="checkbox" id="closedCheck" style="width:auto"> Closed</label></div>
<div id="shiftEditor"></div>
<div class="actions"><button class="btn secondary" onclick="addShiftRow()">+ Add staff</button><button class="btn primary" onclick="saveDay()">Save day</button><button class="btn secondary" onclick="closeModal('adminModal')">Done</button></div>
<hr style="border:0;border-top:1px solid #e2e8f0;margin:18px 0">
<div class="field"><label>Change admin PIN</label><input id="newPin" type="password" inputmode="numeric" placeholder="New PIN"><button class="btn secondary" style="margin-top:7px" onclick="changePin()">Change PIN</button></div>
<div class="actions"><button class="btn danger" onclick="resetData()">Reset to original October rota</button></div>
</div></div>

<script>
const staff={
"ANDY":"#fff200","LYNN":"#f4e8e2","BEV":"#92d050","BEVERLY":"#7030a0","CODY":"#19aee4","EMILY":"#a6a6a6","HAYDEN":"#ff2b2b","CLAIRE":"#f4b400"
};
const sepExtra=[
["2026-09-26",[["BEV","08:30–16:30"],["EMILY","09:00–15:00"]]],
["2026-09-27",[["BEV","09:30–16:00"],["EMILY","10:00–15:00"]]],
["2026-09-28",[["LYNN","08:00–17:00"],["ANDY","09:00–15:00"],["CODY","09:30–14:30"]]],
["2026-09-29",[["LYNN","08:00–17:00"],["ANDY","09:00–15:00"]]],
["2026-09-30",[["LYNN","08:00–17:00"],["ANDY","09:00–15:00"],["CODY","09:30–14:30"]]]
];
const oct=[
["2026-10-01",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"]]],
["2026-10-02",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"],["CODY","09:30–14:30"]]],
["2026-10-03",[["BEV","08:30–16:30"],["BEVERLY","09:30–14:30"],["EMILY","09:00–15:00"]]],
["2026-10-04",[["BEV","09:30–16:00"],["BEVERLY","10:30–14:30"],["EMILY","10:00–15:00"]]],
["2026-10-05",[],true],
["2026-10-06",[["ANDY","08:00–17:00"],["BEV","09:30–14:30"]]],
["2026-10-07",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"],["CODY","09:30–14:30"]]],
["2026-10-08",[["ANDY","08:00–17:00"],["BEV","09:30–14:30"]]],
["2026-10-09",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"],["CODY","09:30–14:30"]]],
["2026-10-10",[["ANDY","08:30–16:30"],["LYNN","09:30–14:30"],["CODY","09:30–14:30"]]],
["2026-10-11",[["ANDY","09:30–16:00"],["LYNN","10:30–15:30"],["CODY","09:30–14:30"]]],
["2026-10-12",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"],["CODY","09:30–14:30"]]],
["2026-10-13",[["ANDY","08:00–17:00"],["BEV","09:30–14:30"]]],
["2026-10-14",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"],["CODY","09:30–14:30"]]],
["2026-10-15",[["ANDY","08:00–17:00"],["BEV","09:30–14:30"]]],
["2026-10-16",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"],["CODY","09:30–14:30"]]],
["2026-10-17",[["BEV","08:30–16:30"],["BEVERLY","09:30–14:30"],["EMILY","09:00–15:00"]]],
["2026-10-18",[["BEV","09:30–17:30"],["BEVERLY","10:30–14:30"],["EMILY","10:00–15:30"]]],
["2026-10-19",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"],["CODY","09:30–14:30"]]],
["2026-10-20",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"],["CODY","09:30–14:30"]]],
["2026-10-21",[["BEV","08:00–17:00"],["LYNN","09:00–15:00"]]],
["2026-10-22",[["BEV","08:00–17:00"],["LYNN","09:00–15:00"],["EMILY","09:00–15:00"]]],
["2026-10-23",[["BEV","08:00–17:00"],["LYNN","09:00–15:00"],["EMILY","09:00–15:00"]]],
["2026-10-24",[["BEV","08:30–16:30"],["LYNN","09:30–14:30"],["EMILY","09:00–15:00"]]],
["2026-10-25",[["BEV","09:30–16:00"],["LYNN","10:30–14:30"],["EMILY","10:30–15:00"]]],
["2026-10-26",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"],["CODY","09:00–15:00"]]],
["2026-10-27",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"],["EMILY","09:00–15:00"]]],
["2026-10-28",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"],["EMILY","09:00–15:00"]]],
["2026-10-29",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"],["EMILY","09:00–15:00"]]],
["2026-10-30",[["ANDY","08:00–17:00"],["LYNN","09:00–15:00"],["CODY","09:00–15:00"]]],
["2026-10-31",[["BEV","08:30–16:30"],["BEVERLY","09:30–14:30"],["LYNN","09:00–15:00"]]]
];
function seed(){
 let d={}; [...sepExtra,...oct].forEach(x=>d[x[0]]={shifts:x[1],closed:!!x[2]}); return d;
}
let data=JSON.parse(localStorage.getItem("workRotaData")||"null")||seed();
let pin=localStorage.getItem("workRotaPin")||"2601";
let view=new Date(2026,9,1);
const fmtDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function render(){
 document.getElementById("monthTitle").textContent=view.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
 let y=view.getFullYear(),m=view.getMonth(),days=new Date(y,m+1,0).getDate(),html="";
 let today=fmtDate(new Date());
 for(let n=1;n<=days;n++){
  let dt=new Date(y,m,n),key=fmtDate(dt),entry=data[key]||{shifts:[],closed:false};
  let cls="day"+(key===today?" today":"")+(entry.closed?" closed":"");
  html+=`<section class="${cls}"><div class="dayhead"><span>${dt.toLocaleDateString("en-GB",{weekday:"short"})} ${n}${suffix(n)}</span><span>${entry.closed?"CLOSED":""}</span></div>`;
  if(entry.closed) html+=`<div class="empty">Closed</div>`;
  else if(!entry.shifts.length) html+=`<div class="empty">No shifts entered</div>`;
  else entry.shifts.forEach(s=>html+=`<div class="shift"><span class="dot" style="background:${staff[s[0]]||"#94a3b8"}"></span><span class="name">${s[0]}</span><span class="time">${s[1]}</span></div>`);
  html+="</section>";
 }
 document.getElementById("rota").innerHTML=html;
 document.getElementById("legend").innerHTML=Object.entries(staff).map(([n,c])=>`<span class="tag"><i style="background:${c}"></i>${n}</span>`).join("");
}
function suffix(n){if(n%100>=11&&n%100<=13)return"th";return({1:"st",2:"nd",3:"rd"}[n%10]||"th")}
function changeMonth(x){view=new Date(view.getFullYear(),view.getMonth()+x,1);render()}
function openAdmin(){document.getElementById("loginModal").style.display="block";document.getElementById("pin").value="";document.getElementById("loginError").textContent=""}
function closeModal(id){document.getElementById(id).style.display="none"}
function login(){if(document.getElementById("pin").value!==pin){document.getElementById("loginError").textContent="Incorrect PIN";return}closeModal("loginModal");document.getElementById("adminModal").style.display="block";document.getElementById("editDate").value=fmtDate(new Date(view.getFullYear(),view.getMonth(),1));loadEditor()}
function loadEditor(){let k=document.getElementById("editDate").value,e=data[k]||{shifts:[],closed:false};document.getElementById("closedCheck").checked=e.closed;document.getElementById("shiftEditor").innerHTML="";e.shifts.forEach(s=>addShiftRow(s[0],s[1]))}
function addShiftRow(name="ANDY",time="09:00–15:00"){let div=document.createElement("div");div.className="editshift";div.innerHTML=`<select>${Object.keys(staff).map(n=>`<option ${n===name?"selected":""}>${n}</option>`).join("")}</select><input value="${time}" placeholder="09:00–15:00"><button class="btn danger" onclick="this.parentElement.remove()">Remove</button>`;document.getElementById("shiftEditor").appendChild(div)}
function saveDay(){let k=document.getElementById("editDate").value;if(!k)return;let shifts=[...document.querySelectorAll(".editshift")].map(r=>[r.querySelector("select").value,r.querySelector("input").value]);data[k]={shifts,closed:document.getElementById("closedCheck").checked};localStorage.setItem("workRotaData",JSON.stringify(data));let d=new Date(k+"T12:00:00");view=new Date(d.getFullYear(),d.getMonth(),1);render();alert("Rota saved on this device.")}
function changePin(){let p=document.getElementById("newPin").value.trim();if(p.length<4){alert("Use at least 4 numbers/characters.");return}pin=p;localStorage.setItem("workRotaPin",pin);document.getElementById("newPin").value="";alert("PIN changed on this device.")}
function resetData(){if(confirm("Reset the rota to the original October version?")){data=seed();localStorage.setItem("workRotaData",JSON.stringify(data));render();loadEditor()}}
render();
</script>
</body></html>
