<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Rota</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:-apple-system,sans-serif;background:#f5f6f8;margin:0;color:#17202a}main{max-width:720px;margin:auto;padding:18px}header,.nav,.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;background:#111827;color:#fff}.light{background:#e5e7eb;color:#111827}.notice,.day{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:12px 0}.notice{background:#fff7cc}.shift{border-top:1px solid #eee;padding-top:8px;margin-top:8px}.muted{color:#6b7280}.closed{color:#b42318;font-weight:700}dialog{width:min(90vw,480px);border:0;border-radius:16px;padding:20px}input{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 12px;border:1px solid #ccc;border-radius:9px}.actions{justify-content:flex-end}.admin{display:none;background:#eaf2ff;padding:10px;border-radius:10px;margin-top:10px}.admin.show{display:flex;justify-content:space-between;align-items:center}</style></head>
<body><main><header><div><h1 style="margin:0">Work Rota</h1><div class="muted">Staff rota</div></div><button id="adminBtn">Admin</button></header>
<div id="adminBar" class="admin"><b>Admin signed in</b><button class="light" id="logout">Sign out</button></div>
<div class="nav" style="margin-top:20px"><button class="light" id="prev">‹</button><h2 id="month"></h2><button class="light" id="next">›</button></div>
<div class="notice">Tap through the month to check your shifts. Admin changes are shared automatically with everyone.</div><div id="status" class="muted"></div><div id="days"></div></main>
<dialog id="login"><h2>Admin login</h2><p class="muted">Use your Supabase admin email and password.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><div id="loginMsg"></div><div class="actions"><button class="light" id="cancelLogin">Cancel</button><button id="signIn">Sign in</button></div></dialog>
<dialog id="edit"><h2>Edit rota day</h2><label>Date</label><input id="date" type="date"><label><input id="closed" type="checkbox" style="width:auto"> Closed</label><label>Staff name</label><input id="name"><label>Start</label><input id="start" type="time"><label>Finish</label><input id="finish" type="time"><div id="editMsg"></div><div class="actions"><button class="light" id="clear">Clear day</button><button class="light" id="done">Done</button><button id="save">Save shift</button></div></dialog>
<script>
const URL='https://eheyqkkvztliicbitbzc.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoZXlxa2t2enRsaWljYml0YnpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzODE5NjMsImV4cCI6MjEwNTk1Nzk2M30.3mnxkywzsrRRGbOWFYzdIbcbEvQcJ7SLA-DcVjvVAS8';
const sb=supabase.createClient(URL,KEY);let cur=new Date(2026,9,1),admin=false,$=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function adminState(v){admin=v;$('adminBar').classList.toggle('show',v)}
async function load(){let y=cur.getFullYear(),m=cur.getMonth(),last=new Date(y,m+1,0).getDate(),a=`${y}-${pad(m+1)}-01`,b=`${y}-${pad(m+1)}-${last}`;$('month').textContent=cur.toLocaleDateString('en-GB',{month:'long',year:'numeric'});$('status').textContent='Loading…';let {data,error}=await sb.from('rota').select('*').gte('shift_date',a).lte('shift_date',b).order('shift_date').order('start_time');if(error){$('status').textContent=error.message;return}$('status').textContent='';let by={};(data||[]).forEach(r=>(by[r.shift_date]??=[]).push(r));let h='';for(let n=1;n<=last;n++){let d=new Date(y,m,n),k=ymd(d),rs=by[k]||[],cl=rs.some(r=>r.is_closed);h+=`<div class="day" data-date="${k}"><b>${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</b>${cl?'<div class="closed">Closed</div>':rs.map(r=>`<div class="shift"><b>${esc(r.staff_name)}</b><div class="muted">${(r.start_time||'').slice(0,5)} – ${(r.end_time||'').slice(0,5)}</div></div>`).join('')||'<div class="muted">No shifts entered</div>'}</div>`}$('days').innerHTML=h;document.querySelectorAll('.day').forEach(x=>x.onclick=()=>{if(admin){$('date').value=x.dataset.date;$('name').value='';$('start').value='';$('finish').value='';$('closed').checked=false;$('editMsg').textContent='';$('edit').showModal()}})}
$('adminBtn').onclick=()=>$('login').showModal();$('cancelLogin').onclick=()=>$('login').close();$('done').onclick=()=>$('edit').close();
$('signIn').onclick=async()=>{let {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}$('login').close();adminState(true)};
$('logout').onclick=async()=>{await sb.auth.signOut();adminState(false)};$('prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);load()};$('next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);load()};
$('save').onclick=async()=>{let d=$('date').value,r;if($('closed').checked){r=await sb.from('rota').delete().eq('shift_date',d);if(!r.error)r=await sb.from('rota').insert({shift_date:d,staff_name:'Closed',is_closed:true})}else{if(!$('name').value.trim()){$('editMsg').textContent='Enter a staff name';return}r=await sb.from('rota').insert({shift_date:d,staff_name:$('name').value.trim(),start_time:$('start').value||null,end_time:$('finish').value||null,is_closed:false})}$('editMsg').textContent=r.error?r.error.message:'Saved';if(!r.error)load()};
$('clear').onclick=async()=>{if(!confirm('Clear this whole day?'))return;let {error}=await sb.from('rota').delete().eq('shift_date',$('date').value);$('editMsg').textContent=error?error.message:'Day cleared';if(!error)load()};
sb.auth.getSession().then(({data})=>adminState(!!data.session));sb.auth.onAuthStateChange((e,s)=>adminState(!!s));load();
</script></body></html>
