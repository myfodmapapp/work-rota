<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b63">
<title>Work Rota V11</title>
<style>
:root{--navy:#173b63;--bg:#f4f7fb;--card:#fff;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#142033}
header{background:var(--navy);color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:4;box-shadow:0 2px 12px #0002}
.head{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:24px;margin:0}.sub{opacity:.8;font-size:13px;margin-top:3px}
button,select,input{font:inherit}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}
.adminBtn{background:white;color:var(--navy)}
main{max-width:900px;margin:auto;padding:18px}
.monthbar{display:flex;justify-content:space-between;align-items:center;background:white;border-radius:16px;padding:12px;margin-bottom:14px;box-shadow:0 2px 10px #102a4310}
.monthbar h2{margin:0;font-size:20px}.arrow{background:#eef3f8;color:#173b63;font-size:20px;min-width:44px}
.filterbar{background:white;border-radius:14px;padding:12px;margin-bottom:14px;box-shadow:0 2px 10px #102a4310}.filterbar label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.filterbar select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:white}.notice{background:#fff7d6;border:1px solid #f1d46b;border-radius:12px;padding:11px 13px;margin-bottom:14px;font-size:14px}
.status{font-size:12px;color:var(--muted);margin:0 0 10px 2px}.status.bad{color:#b91c1c}
.day{background:white;border-radius:15px;margin:10px 0;overflow:hidden;box-shadow:0 2px 10px #102a4310}
.dayhead{padding:11px 13px;background:#edf2f7;display:flex;justify-content:space-between;font-weight:800}
.today .dayhead{background:#dbeafe;color:#173b63}.closed .dayhead{background:#fee2e2;color:#991b1b}
.shift{display:grid;grid-template-columns:12px 1fr auto;gap:11px;align-items:center;padding:12px 13px;border-top:1px solid var(--line)}
.dot{width:12px;height:36px;border-radius:7px}.name{font-weight:800}.time{font-weight:700;color:#334155}
.empty{padding:18px;color:var(--muted);text-align:center}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tag{background:white;border-radius:20px;padding:7px 10px;font-size:12px;box-shadow:0 1px 5px #0001}.tag i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
footer{text-align:center;color:#94a3b8;font-size:12px;padding:18px}
.modal{display:none;position:fixed;inset:0;background:#071525aa;z-index:20;padding:18px;overflow:auto}
.panel{max-width:650px;margin:30px auto;background:white;border-radius:18px;padding:18px}.panel h2{margin-top:0}
.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary{background:var(--navy);color:white}.secondary{background:#e8eef5;color:#173b63}.danger{background:#fee2e2;color:#991b1b}
.editshift{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:7px}.small{font-size:12px;color:var(--muted)}#loginError{color:#b91c1c;font-size:13px}
@media(max-width:520px){main{padding:12px}.editshift{grid-template-columns:1fr 1fr}.editshift button{grid-column:1/3}}

.printBtn{width:100%;margin-top:10px;background:var(--navy);color:white}
@media print{
 @page{size:auto;margin:8mm}
 header,.filterbar,.notice,.status,.legend,footer,.arrow{display:none!important}
 body{background:#fff}
 main{max-width:none;padding:0}
 .monthbar{box-shadow:none;margin:0 0 8px;padding:0;background:#fff}
 .monthbar h2{font-size:20px}
 .day{box-shadow:none;border:1px solid #cbd5e1;border-radius:5px;margin:4px 0;break-inside:avoid}
 .dayhead{padding:5px 8px}
 .shift{padding:5px 8px}
 .dot{height:20px}
 .empty{padding:6px}
}

</style>
</head>
<body>
<header><div class="head"><div><h1>Work Rota <span style="font-size:14px;opacity:.85">V11</span></h1><div class="sub">Staff rota</div></div></div></header>
<main>
<div class="monthbar"><button class="btn arrow" onclick="changeMonth(-1)">‹</button><h2 id="monthTitle"></h2><button class="btn arrow" onclick="changeMonth(1)">›</button></div>
<div class="filterbar"><label for="nameFilter">Filter by name</label><select id="nameFilter" onchange="render()"><option value="">Everyone</option><option>ANDY</option><option>LYNN</option><option>BEV</option><option>BEVERLY</option><option>CODY</option><option>EMILY</option></select><button type="button" class="btn primary printBtn" onclick="printMonth()">Print month</button></div>
<div class="notice">Tap through the month to check your shifts. Use the name filter to show one person's shifts.</div>
<div id="status" class="status">Loading shared rota…</div>
<div id="rota"></div><div class="legend" id="legend"></div>
</main>
<footer>Work Rota • Temporary staff rota app</footer>

<script>

const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoZXlxa2t2enRsaWljYml0YnpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzODE5NjMsImV4cCI6MjEwNTk1Nzk2M30.3mnxkywzsrRRGbOWFYzdIbcbEvQcJ7SLA-DcVjvVAS8";
const staff={"ANDY":"#fff200","LYNN":"#f4e8e2","BEV":"#92d050","BEVERLY":"#7030a0","CODY":"#19aee4","EMILY":"#a6a6a6","HAYDEN":"#ff2b2b","CLAIRE":"#f4b400"};

let data={}, view=new Date(2026,9,1);
const fmtDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

function status(msg,bad=false){
 const e=document.getElementById("status");
 e.textContent=msg;
 e.className="status"+(bad?" bad":"");
}
function buildRota(){
 data={};
 for(const r of seedRows){
  const key=r[0];
  const entry=data[key]||(data[key]={shifts:[],closed:false});
  if(r[1]==="CLOSED") entry.closed=true;
  else entry.shifts.push([r[1],r[2]+"–"+r[3]]);
 }
 status("Rota is up to date.");
 render();
}
function render(){
 document.getElementById("monthTitle").textContent=view.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
 const y=view.getFullYear(),m=view.getMonth(),days=new Date(y,m+1,0).getDate(),today=fmtDate(new Date());
 const filter=document.getElementById("nameFilter")?.value||"";
 let html="";
 for(let n=1;n<=days;n++){
  const dt=new Date(y,m,n),key=fmtDate(dt),entry=data[key]||{shifts:[],closed:false};
  const cls="day"+(key===today?" today":"")+(entry.closed?" closed":"");
  const visibleShifts=filter?entry.shifts.filter(x=>x[0]===filter):entry.shifts;
  if(filter&&!visibleShifts.length)continue;
  html+=`<section class="${cls}"><div class="dayhead"><span>${dt.toLocaleDateString("en-GB",{weekday:"short"})} ${n}${suffix(n)}</span><span>${entry.closed?"CLOSED":""}</span></div>`;
  if(entry.closed) html+=`<div class="empty">Closed</div>`;
  else if(!visibleShifts.length) html+=`<div class="empty">No shifts entered</div>`;
  else visibleShifts.forEach(x=>html+=`<div class="shift"><span class="dot" style="background:${staff[x[0]]||"#94a3b8"}"></span><span class="name">${x[0]}</span><span class="time">${x[1]}</span></div>`);
  html+="</section>";
 }
 document.getElementById("rota").innerHTML=html;
 document.getElementById("legend").innerHTML=Object.entries(staff).map(([n,c])=>`<span class="tag"><i style="background:${c}"></i>${n}</span>`).join("");
}
function suffix(n){
 if(n%100>=11&&n%100<=13)return"th";
 return({1:"st",2:"nd",3:"rd"}[n%10]||"th");
}
function changeMonth(x){
 view=new Date(view.getFullYear(),view.getMonth()+x,1);
 render();
}
function printMonth(){
 const y=view.getFullYear(), m=view.getMonth();
 const monthName=view.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
 const days=new Date(y,m+1,0).getDate();
 const first=new Date(y,m,1);
 const mondayIndex=(first.getDay()+6)%7;
 const filter=document.getElementById("nameFilter")?.value||"";
 let cells=[];
 for(let i=0;i<mondayIndex;i++) cells.push('<div class="pcell blank"></div>');
 for(let n=1;n<=days;n++){
   const key=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`;
   const e=data[key]||{shifts:[],closed:false};
   let body="";
   if(e.closed){
     body='<div class="pclosed">CLOSED</div>';
   }else{
     let shifts=e.shifts;
     if(filter) shifts=shifts.filter(x=>x[0]===filter);
     body=shifts.map(x=>`<div class="pshift"><i style="background:${staff[x[0]]||"#94a3b8"}"></i><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
   }
   cells.push(`<div class="pcell"><div class="pdate">${n}</div>${body}</div>`);
 }
 while(cells.length%7) cells.push('<div class="pcell blank"></div>');
 const html=`<!doctype html><html><head><meta charset="utf-8"><title>${monthName} Work Rota</title>
 <style>
 @page{size:A4 landscape;margin:7mm}
 *{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;color:#142033}
 h1{text-align:center;margin:0 0 5mm;font-size:22px}
 .week{display:grid;grid-template-columns:repeat(7,1fr);font-weight:800;text-align:center;font-size:10px;margin-bottom:1mm}
 .grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:31mm;border-left:1px solid #aab4c0;border-top:1px solid #aab4c0}
 .pcell{border-right:1px solid #aab4c0;border-bottom:1px solid #aab4c0;padding:2mm;overflow:hidden}
 .blank{background:#f7f8fa}.pdate{font-weight:900;font-size:11px;margin-bottom:1.2mm}
 .pshift{display:grid;grid-template-columns:3px 1fr auto;gap:3px;align-items:center;font-size:8px;line-height:1.35;margin:1mm 0}
 .pshift i{width:3px;height:11px;border-radius:2px}.pshift b{white-space:nowrap}.pshift span{white-space:nowrap}
 .pclosed{font-weight:900;color:#b91c1c;background:#fee2e2;border-radius:3px;padding:2mm;text-align:center;font-size:9px;margin-top:3mm}
 .foot{text-align:right;font-size:7px;color:#64748b;margin-top:2mm}
 </style></head><body><h1>${monthName}</h1>
 <div class="week"><div>Monday</div><div>Tuesday</div><div>Wednesday</div><div>Thursday</div><div>Friday</div><div>Saturday</div><div>Sunday</div></div>
 <div class="grid">${cells.join("")}</div><div class="foot">Work Rota • V11</div>
 <script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`;
 const w=window.open("","_blank");
 if(!w){alert("Please allow pop-ups to print the rota.");return}
 w.document.open();w.document.write(html);w.document.close();
}
buildRota();

</script>
</body></html>
